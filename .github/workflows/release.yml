name: Release

on:
  # Two ways in. A tag is the tidier record, but pressing the button in the
  # Actions tab needs no push rights over `refs/tags/*`: the release step
  # creates the tag itself, as part of publishing the release.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.1.0 (a leading v is optional)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Work out what is being released
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          # Through the environment rather than inlined, so a version string
          # can never be read as part of the script itself.
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::\"$RAW_VERSION\" is not a version like 0.1.0 or v0.1.0."
            exit 1
          fi

          # Refuse to label a release with a version the code does not claim.
          declared="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$version" != "$declared" ]; then
            echo "::error::Asked to release $version, but Cargo.toml says $declared. \
          Update the version in Cargo.toml, apps/desktop/src-tauri/tauri.conf.json and \
          wordpress/otwono-ai-connector/otwono-ai-connector.php first."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as tag v$version."

  verify:
    name: Verify before building anything
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            php-cli php-curl
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: |
          npm run format:check
          npm run typecheck
          npm run test
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          php wordpress/tests/run-tests.php
          ./scripts/run-wordpress-live-tests.sh

  linux:
    name: Linux package and the plugin
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run desktop:build:linux
      - name: Collect
        run: |
          mkdir -p artefacts
          find target/release/bundle -type f -name '*.deb' -exec cp {} artefacts/ \;
          ./scripts/package-wordpress-plugin.sh artefacts
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artefacts/

  windows:
    name: Windows installers
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # The installers are unsigned. Signing needs a certificate the project
      # owner must provide; see docs/RELEASE.md.
      - run: npm run desktop:build:windows
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artefacts | Out-Null
          Get-ChildItem -Path target/release/bundle -Recurse -Include '*.exe', '*.msi' |
            ForEach-Object { Copy-Item $_.FullName -Destination artefacts -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artefacts/

  macos:
    name: macOS package
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Unsigned and un-notarised; users must right-click → Open on first
      # launch until the owner provides a Developer ID. See docs/RELEASE.md.
      - run: npm run desktop:build:macos
      - name: Collect
        run: |
          mkdir -p artefacts
          find target/release/bundle -type f -name '*.dmg' -exec cp {} artefacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artefacts/

  collect:
    name: One folder, with checksums
    needs: [prepare, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Assemble
        run: |
          mkdir -p release
          find downloaded -type f -exec cp {} release/ \;
          cd release

          # GitHub replaces spaces with dots in an asset's filename as it
          # uploads. Renaming first means `SHA256SUMS` names the files as they
          # are actually served, so `sha256sum -c SHA256SUMS` works on a
          # downloaded release instead of failing on every line.
          for file in *; do
            case "$file" in
              *\ *) mv -- "$file" "${file// /.}" ;;
            esac
          done

          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
      # Published rather than drafted. A draft holds the tag name without
      # creating the ref, so `v0.1.0` only comes into existence at the moment
      # the release is published — and publishing by hand proved unreliable.
      # Starting this run is the deliberate act; the review happens before it,
      # in `verify` and in whoever pressed the button.
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: OTWONO AI ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          body: |
            See `RELEASE_NOTES.md` in the repository for what changed.

            The desktop installers in this release are **unsigned**. Windows
            will warn about an unknown publisher and macOS will need
            right-click → Open on first launch. Verify the download against
            `SHA256SUMS` before running it.
